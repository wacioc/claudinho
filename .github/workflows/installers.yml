name: installers
# Builds the installer of each system on a machine of that system, installs or mounts it there, and starts the
# packaged app once (pack-check.js). Started by a version tag (`npm version patch`, then
# `git push --follow-tags`) it then publishes the installers as that version's release. Started by hand from
# the Actions tab it only builds and checks; the installers stay with the run for a week.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu by its version, not ubuntu-latest: node-pty is compiled on this machine, and what is compiled
        # on a newer release does not load on an older one.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # The Mac build waits for Apple to notarise each of its two apps.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run dist
        if: runner.os != 'macOS'
      # Only the Mac build gets the secrets: electron-builder reads CSC_LINK on Windows too, and would try to sign
      # the installer there with the Mac certificate. CSC_LINK is the Developer ID Application certificate with
      # its private key, exported as .p12 and base64-encoded; CSC_KEY_PASSWORD is the export password.
      - name: Build, sign and notarise (macOS)
        if: runner.os == 'macOS'
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Install it and start the installed app (Windows)
        if: runner.os == 'Windows'
        run: |
          Start-Process -Wait (Get-Item dist\*.exe).FullName -ArgumentList '/S'
          node pack-check.js "$env:LOCALAPPDATA\Programs\claudinho\claudinho.exe"
      - name: Let the installed app update itself to a second build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # A second build that claims version 99.0.0 goes into a folder of its own, which is not uploaded. The
        # installed app is pointed at it and has to come back as that version (see pack-check.js).
        run: |
          npx electron-builder --publish never --config.extraMetadata.version=99.0.0 --config.directories.output=dist-next
          node pack-check.js "$LOCALAPPDATA/Programs/claudinho/claudinho.exe" --update dist-next
      - name: Start the app from each disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          for arch in arm64 x64; do
            hdiutil attach dist/*-mac-$arch.dmg -nobrowse -readonly -mountpoint /tmp/claudinho-$arch
            codesign --verify --deep --strict /tmp/claudinho-$arch/claudinho.app
            codesign -dv /tmp/claudinho-$arch/claudinho.app 2>&1 | grep -E '^(Identifier|Format|Signature|CodeDirectory)'
            # Gatekeeper's verdict on the app. Without the secrets electron-builder signs nothing, and a downloaded
            # app that is unsigned or not notarised is refused, so the release must not go out.
            spctl -a -vv /tmp/claudinho-$arch/claudinho.app 2>&1 | grep 'source=Notarized Developer ID'
            node pack-check.js /tmp/claudinho-$arch/claudinho.app/Contents/MacOS/claudinho
          done
      - name: Let the app update itself to a second build (macOS)
        if: runner.os == 'macOS'
        # As on Windows. macOS takes an update only from the developer who signed the running app, so the second
        # build gets the certificate too. It is not notarised: that is not asked of an update, and takes minutes.
        # One processor type is enough here, the machine's own. The app is copied off its read-only disk image.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder --mac zip --arm64 --publish never --config.extraMetadata.version=99.0.0 --config.directories.output=dist-next --config.mac.notarize=false
          mkdir update-try && cp -R /tmp/claudinho-arm64/claudinho.app update-try/
          node pack-check.js update-try/claudinho.app/Contents/MacOS/claudinho --update dist-next
      - name: Start the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # For the log: the newest glibc and libstdc++ the terminal library compiled here asks for. A system
          # with older ones cannot load it; the README names the minimum under "Install".
          for lib in GLIBC GLIBCXX; do
            objdump -T dist/linux-unpacked/resources/app/node_modules/node-pty/build/Release/pty.node | grep -oE "${lib}_[0-9.]+" | sort -uV | tail -n 1
          done
          chmod +x dist/*.AppImage
          xvfb-run -a node pack-check.js dist/*.AppImage
          # Then the update, as on Windows. An AppImage that updates is replaced by the new file, so this runs on
          # a copy: what is in dist/ is what gets published.
          npx electron-builder --publish never --config.extraMetadata.version=99.0.0 --config.directories.output=dist-next
          mkdir update-try && cp dist/*.AppImage update-try/
          xvfb-run -a node pack-check.js update-try/*.AppImage --update dist-next
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          # Beside the installers: what the app's own update reads from a release (see "the app itself" in main.js).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # to create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - run: >
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
          --notes "Installers for Windows, macOS and Linux. The Windows installer is not signed, so Windows asks once before the first start: see [Install](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#install). What changed is in the [changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
